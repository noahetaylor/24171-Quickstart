<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot Table Editor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5d6573; --line: #d9dde3;
    --grid: #eceef2; --axis: #9aa3b1;
    --hit: #15803d; --miss: #b91c1c; --row: #2563eb; --suggest: #c2410c; --phys: #9aa3b1;
    --accent: #16181d; --accent-ink: #ffffff;
    --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --warn-bg: #fff7ed; --bad-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --ink: #e8eaee; --muted: #9aa3b1; --line: #2c313a;
      --grid: #1d2027; --axis: #5d6573;
      --hit: #4ade80; --miss: #f87171; --row: #60a5fa; --suggest: #fb923c; --phys: #5d6573;
      --accent: #e8eaee; --accent-ink: #111317;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --warn-bg: #2a2112; --bad-bg: #2a1515;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-rows: auto auto 1fr; overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .file { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; }
  header .spacer { flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .status.dirty .dot { background: var(--warn); }
  .status.error .dot { background: var(--bad); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.small { padding: 2px 8px; font-size: 12px; }
  #banner { display: none; padding: 10px 16px; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  #banner.show { display: flex; }
  #banner.warn { background: var(--warn-bg); }
  #banner.bad { background: var(--bad-bg); }
  #banner .msg { flex: 1; min-width: 240px; white-space: pre-wrap; }
  main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr; }
  .tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
  .tabs button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  svg { display: block; width: 100%; height: 100%; user-select: none; touch-action: none; }
  .tabs .hint { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; text-align: right; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .card h2 .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; font-weight: 600; font-size: 12px; color: var(--muted); padding: 2px 4px; }
  td { padding: 2px 4px; }
  tr.sel td { background: color-mix(in srgb, var(--row) 15%, transparent); }
  input[type=number] { font: inherit; width: 100%; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); text-align: right; }
  input.invalid { border-color: var(--bad); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #drop { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); font-size: 12px; }
  #drop.over { border-color: var(--row); color: var(--ink); }
  .files label { display: flex; gap: 6px; align-items: center; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  details summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  details li, details p { font-size: 12px; color: var(--muted); }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  @media (max-width: 860px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .tabs .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Shot Table Editor</h1>
  <span class="file" id="file">loading…</span>
  <span class="spacer"></span>
  <span class="status" id="status"><span class="dot"></span><span id="statusText">Loading</span></span>
  <button id="pull" title="Copy new shot logs from the robot (laptop on the robot's Wi-Fi, or USB)">Pull from robot</button>
  <button id="revert" disabled title="Throw away edits and reload the file">Revert</button>
  <button id="save" class="primary" disabled title="Write ShotTables.java (Ctrl+S)">Save</button>
</header>
<div id="banner"><span class="msg" id="bannerMsg"></span><span id="bannerButtons"></span></div>
<main>
  <div id="stage">
    <div class="tabs"><span id="tabs" style="display:flex;gap:6px"></span>
      <span class="hint">Drag a blue row to move it · double-click to add · <kbd>Delete</kbd> removes the selected row · <kbd>Shift</kbd>-drag: no snapping</span></div>
    <div style="position:relative;min-height:0">
      <svg id="svg" aria-label="Shots and table rows: distance vs rpm"></svg>
    </div>
  </div>
  <aside id="side"></aside>
</main>

<script>
"use strict";

const SHOOTERS = ["POLLEN", "NECTAR"];
const state = {
  shooter: "POLLEN",
  tables: { POLLEN: [], NECTAR: [] },   // rows: [distance, hood, rpm]
  saved: null,                           // JSON of tables as on disk
  hash: null,
  file: "",
  physics: null,
  shots: [], files: [], logDir: "", badLines: 0,
  excluded: new Set(),                   // log files turned off
  hoodOnly: true,
  selected: -1,
  suggestion: null,
};

const $ = (id) => document.getElementById(id);
const svg = $("svg");
const NS = "http://www.w3.org/2000/svg";

// ----------------------------------------------------------- data access

async function api(path, body) {
  const opts = body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty */ }
  return { status: res.status, data };
}

async function loadTables() {
  const { status, data } = await api("/api/tables");
  if (status !== 200) { showBanner("bad", data.error || "Could not read ShotTables.java"); setStatus("error", "Error"); return; }
  state.tables = data.tables;
  state.saved = JSON.stringify(data.tables);
  state.hash = data.hash;
  state.file = data.file;
  state.physics = data.physics;
  state.selected = -1;
  state.suggestion = null;
  $("file").textContent = data.file;
  hideBanner();
  render();
}

async function loadShots() {
  const { status, data } = await api("/api/shots");
  if (status !== 200) { showBanner("bad", data.error || "Could not read shot logs"); return; }
  state.shots = data.shots;
  state.files = data.files;
  state.logDir = data.dir;
  state.badLines = data.badLines;
  render();
}

function dirty() { return JSON.stringify(state.tables) !== state.saved; }

function setStatus(kind, text) {
  $("status").className = "status " + kind;
  $("statusText").textContent = text;
}

function showBanner(kind, msg, buttons) {
  const b = $("banner");
  b.className = "show " + kind;
  $("bannerMsg").textContent = msg;
  const box = $("bannerButtons");
  box.innerHTML = "";
  (buttons || []).forEach(([label, fn, primary]) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (primary) btn.className = "primary";
    btn.onclick = fn;
    box.appendChild(btn);
  });
}
function hideBanner() { $("banner").className = ""; }

// ----------------------------------------------------------- save

async function save(force) {
  const { status, data } = await api("/api/tables", { tables: state.tables, baseHash: state.hash, force: !!force });
  if (status === 200) {
    state.tables = data.tables;
    state.saved = JSON.stringify(data.tables);
    state.hash = data.hash;
    hideBanner();
    render();
    setStatus("", "Saved. Build + deploy in Android Studio to use it.");
  } else if (status === 409) {
    showBanner("warn", "ShotTables.java was changed outside this tool (Android Studio, git pull…) since you opened it.", [
      ["Reload the file (lose my edits)", () => loadTables()],
      ["Overwrite it with my edits", () => save(true), true],
    ]);
  } else {
    showBanner("bad", "Not saved: " + (data.error || ("HTTP " + status)));
  }
}

// ----------------------------------------------------------- physics

function physicsRpm(d) {
  const p = state.physics;
  if (!p) return NaN;
  const a = p.hoodDeg * Math.PI / 180;
  const h = p.targetHeight - p.releaseHeight[state.shooter];
  const c = Math.cos(a);
  const denom = 2 * c * c * (d * Math.tan(a) - h);
  if (denom <= 0) return NaN;
  const v = Math.sqrt(386.09 * d * d / denom);
  return v / p.efficiency / (Math.PI * p.wheelDiameter[state.shooter]) * 60;
}

// ----------------------------------------------------------- shots

function visibleShots() {
  const hood = state.physics ? state.physics.hoodDeg : null;
  return state.shots.filter((s) => s.shooter === state.shooter && !state.excluded.has(s.file)
    && (!state.hoodOnly || hood === null || Math.abs(s.hood - hood) < 0.5));
}

function median(xs) {
  const s = xs.slice().sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/** Rows from the hits: group hits whose distances are within 4 in of the next, 2+ hits per group. */
function suggestRows() {
  const hits = visibleShots().filter((s) => s.hit).sort((a, b) => a.distance - b.distance);
  const groups = [];
  for (const s of hits) {
    const g = groups[groups.length - 1];
    if (g && s.distance - g[g.length - 1].distance <= 4) g.push(s); else groups.push([s]);
  }
  return groups.filter((g) => g.length >= 2).map((g) => [
    Math.round(2 * g.reduce((t, s) => t + s.distance, 0) / g.length) / 2,
    median(g.map((s) => s.hood)),
    Math.round(median(g.map((s) => s.rpmTarget)) / 10) * 10,
  ]);
}

// ----------------------------------------------------------- chart geometry

let view = null; // {x0,x1,y0,y1, left,top,w,h}

function computeView() {
  const rect = svg.getBoundingClientRect();
  const W = Math.max(rect.width, 300), H = Math.max(rect.height, 240);
  const rows = state.tables[state.shooter];
  const shots = visibleShots();
  const ds = rows.map((r) => r[0]).concat(shots.map((s) => s.distance));
  const rs = rows.map((r) => r[2]).concat(shots.map((s) => s.rpmTarget));
  let x0 = 24, x1 = 132, y0 = 1500, y1 = 5000;
  if (ds.length) { x0 = Math.min(x0, Math.min(...ds) - 6); x1 = Math.max(x1, Math.max(...ds) + 6); }
  if (rs.length) { y0 = Math.min(y0, Math.min(...rs) - 200); y1 = Math.max(y1, Math.max(...rs) + 200); }
  x0 = Math.max(0, Math.floor(x0 / 12) * 12); x1 = Math.ceil(x1 / 12) * 12;
  y0 = Math.max(0, Math.floor(y0 / 500) * 500); y1 = Math.ceil(y1 / 500) * 500;
  const left = 64, top = 16, right = 20, bottom = 48;
  view = { x0, x1, y0, y1, left, top, w: W - left - right, h: H - top - bottom, W, H };
}
const sx = (d) => view.left + (d - view.x0) / (view.x1 - view.x0) * view.w;
const sy = (r) => view.top + (1 - (r - view.y0) / (view.y1 - view.y0)) * view.h;
const dx = (px) => view.x0 + (px - view.left) / view.w * (view.x1 - view.x0);
const dy = (py) => view.y0 + (1 - (py - view.top) / view.h) * (view.y1 - view.y0);

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}

// ----------------------------------------------------------- render

function render() {
  setStatus(dirty() ? "dirty" : "", dirty() ? "Unsaved changes" : "Saved");
  $("save").disabled = !dirty();
  $("revert").disabled = !dirty();
  renderTabs();
  renderChart();
  renderSide();
}

function renderTabs() {
  const box = $("tabs");
  box.innerHTML = "";
  for (const s of SHOOTERS) {
    const b = document.createElement("button");
    b.textContent = s + " (" + state.tables[s].length + " rows)";
    b.setAttribute("aria-pressed", s === state.shooter);
    b.onclick = () => { state.shooter = s; state.selected = -1; state.suggestion = null; render(); };
    box.appendChild(b);
  }
}

function renderChart() {
  computeView();
  svg.innerHTML = "";
  const css = getComputedStyle(document.documentElement);
  const c = (n) => css.getPropertyValue(n).trim();

  // grid + axes
  for (let d = view.x0; d <= view.x1; d += 12) {
    el("line", { x1: sx(d), x2: sx(d), y1: view.top, y2: view.top + view.h, stroke: c("--grid") });
    el("text", { x: sx(d), y: view.top + view.h + 16, "text-anchor": "middle", "font-size": 11, fill: c("--muted") }).textContent = d;
  }
  for (let r = view.y0; r <= view.y1; r += 500) {
    el("line", { x1: view.left, x2: view.left + view.w, y1: sy(r), y2: sy(r), stroke: c("--grid") });
    el("text", { x: view.left - 6, y: sy(r) + 4, "text-anchor": "end", "font-size": 11, fill: c("--muted") }).textContent = r;
  }
  el("rect", { x: view.left, y: view.top, width: view.w, height: view.h, fill: "none", stroke: c("--axis") });
  el("text", { x: view.left + view.w / 2, y: view.H - 10, "text-anchor": "middle", "font-size": 12, fill: c("--muted") }).textContent = "distance, release point to CELL (in)";
  const yl = el("text", { x: 14, y: view.top + view.h / 2, "text-anchor": "middle", "font-size": 12, fill: c("--muted"),
    transform: `rotate(-90 14 ${view.top + view.h / 2})` });
  yl.textContent = "flywheel rpm";

  // physics curve
  if (state.physics) {
    let dpath = "";
    for (let d = view.x0; d <= view.x1; d += 1) {
      const r = physicsRpm(d);
      if (!isFinite(r) || r < view.y0 || r > view.y1) continue;
      dpath += (dpath ? " L" : "M") + sx(d).toFixed(1) + " " + sy(r).toFixed(1);
    }
    if (dpath) el("path", { d: dpath, fill: "none", stroke: c("--phys"), "stroke-dasharray": "5 4", "stroke-width": 1.5 });
  }

  // shots
  for (const s of visibleShots()) {
    const x = sx(s.distance), y = sy(s.rpmTarget);
    if (s.hit) {
      el("circle", { cx: x, cy: y, r: 4, fill: c("--hit"), "fill-opacity": 0.75 });
    } else {
      const k = 4;
      el("path", { d: `M${x - k} ${y - k} L${x + k} ${y + k} M${x - k} ${y + k} L${x + k} ${y - k}`, stroke: c("--miss"), "stroke-width": 2 });
    }
  }

  // suggestion preview
  if (state.suggestion && state.suggestion.length) {
    el("path", { d: state.suggestion.map((r, i) => (i ? "L" : "M") + sx(r[0]) + " " + sy(r[2])).join(" "),
      fill: "none", stroke: c("--suggest"), "stroke-width": 2, "stroke-dasharray": "2 3" });
    for (const r of state.suggestion) el("circle", { cx: sx(r[0]), cy: sy(r[2]), r: 5, fill: "none", stroke: c("--suggest"), "stroke-width": 2 });
  }

  // table rows
  const rows = state.tables[state.shooter];
  if (rows.length > 1) {
    el("path", { d: rows.map((r, i) => (i ? "L" : "M") + sx(r[0]) + " " + sy(r[2])).join(" "),
      fill: "none", stroke: c("--row"), "stroke-width": 2.5 });
  }
  rows.forEach((r, i) => {
    const size = i === state.selected ? 14 : 10;
    const h = el("rect", { x: sx(r[0]) - size / 2, y: sy(r[2]) - size / 2, width: size, height: size, rx: 2,
      fill: c("--row"), stroke: i === state.selected ? c("--ink") : "none", "stroke-width": 2, style: "cursor:move" });
    h.addEventListener("pointerdown", (e) => startDrag(e, i));
  });
}

function renderSide() {
  const side = $("side");
  const rows = state.tables[state.shooter];
  const shots = visibleShots();
  const hits = shots.filter((s) => s.hit).length;
  const hood = state.physics ? state.physics.hoodDeg : 60;

  side.innerHTML = `
    <div class="card">
      <h2>${state.shooter} table <span class="spacer"></span>
        <button class="small" id="addRow">Add row</button></h2>
      <table><thead><tr><th>distance (in)</th><th>hood (°)</th><th>rpm</th><th></th></tr></thead>
      <tbody id="rowsBody"></tbody></table>
      <p class="muted">${rows.length < 2 ? "Fewer than 2 rows: the robot uses physics for every distance." :
        "Between " + rows[0][0] + " and " + rows[rows.length - 1][0] + " in the robot uses these rows; outside, physics."}</p>
    </div>
    <div class="card">
      <h2>Shots <span class="spacer"></span><span class="muted">${hits} hit / ${shots.length - hits} miss</span></h2>
      <div class="legend">
        <span><span class="sw" style="background:var(--hit)"></span>hit</span>
        <span><span style="color:var(--miss);font-weight:700">×</span>miss</span>
        <span><span class="sw" style="background:var(--row);border-radius:2px"></span>table row</span>
        <span><span style="color:var(--phys)">- - -</span>physics (no drag)</span>
      </div>
      <p><button id="suggest" ${hits < 2 ? "disabled" : ""}>Suggest rows from hits</button>
         ${state.suggestion ? `<button id="applySuggest" class="primary">Use ${state.suggestion.length} suggested rows</button>
         <button id="clearSuggest" class="small">Hide</button>` : ""}</p>
      <p class="muted">Groups hits within 4 in of each other (2+ hits each) and takes the middle rpm of each group.</p>
      <label class="muted"><input type="checkbox" id="hoodOnly" ${state.hoodOnly ? "checked" : ""}>
        only shots taken with the ${hood}° hood</label>
    </div>
    <div class="card">
      <h2>Shot logs</h2>
      <div class="files" id="files"></div>
      <div id="drop">Drag shot CSV files here, or use <b>Pull from robot</b>.</div>
      <p class="muted">Stored in <code>${state.logDir}</code>. Commit them to keep the history.
        ${state.badLines ? "<br>" + state.badLines + " unreadable line(s) skipped." : ""}</p>
    </div>
    <details class="card"><summary>How to tune</summary><ol>
      <li>Robot: run <b>Shot Tuner</b> (Testing). Shoot from several distances; press RB for each ball that goes in, LB for each miss.</li>
      <li>Laptop on the robot's Wi-Fi: <b>Pull from robot</b>.</li>
      <li>Put the blue rows where the green dots are thickest: drag, or <b>Suggest rows from hits</b>.</li>
      <li><b>Save</b>, then build + deploy in Android Studio.</li>
    </ol></details>`;

  const body = $("rowsBody");
  rows.forEach((r, i) => {
    const tr = document.createElement("tr");
    if (i === state.selected) tr.className = "sel";
    [0, 1, 2].forEach((k) => {
      const td = document.createElement("td");
      const inp = document.createElement("input");
      inp.type = "number";
      inp.step = k === 2 ? "10" : "0.5";
      inp.value = r[k];
      inp.onfocus = () => { if (state.selected !== i) { state.selected = i; renderChart(); } };
      inp.onchange = () => {
        const v = parseFloat(inp.value);
        if (!isFinite(v)) { inp.classList.add("invalid"); return; }
        r[k] = v;
        sortRows();
        render();
      };
      td.appendChild(inp);
      tr.appendChild(td);
    });
    const td = document.createElement("td");
    const del = document.createElement("button");
    del.className = "small"; del.textContent = "✕"; del.title = "Delete row";
    del.onclick = () => { rows.splice(i, 1); state.selected = -1; render(); };
    td.appendChild(del);
    tr.appendChild(td);
    body.appendChild(tr);
  });

  $("addRow").onclick = () => {
    const last = rows[rows.length - 1];
    const d = last ? last[0] + 12 : 48;
    const p = physicsRpm(d);
    rows.push([d, hood, Math.round((isFinite(p) ? p : (last ? last[2] + 200 : 3000)) / 10) * 10]);
    sortRows();
    render();
  };
  $("suggest").onclick = () => { state.suggestion = suggestRows(); render(); };
  if (state.suggestion) {
    $("applySuggest").onclick = () => { state.tables[state.shooter] = state.suggestion; state.suggestion = null; state.selected = -1; render(); };
    $("clearSuggest").onclick = () => { state.suggestion = null; render(); };
  }
  $("hoodOnly").onchange = (e) => { state.hoodOnly = e.target.checked; render(); };

  const files = $("files");
  for (const f of state.files) {
    const lab = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !state.excluded.has(f.name);
    cb.onchange = () => { if (cb.checked) state.excluded.delete(f.name); else state.excluded.add(f.name); render(); };
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(f.name + " (" + f.count + ")"));
    files.appendChild(lab);
  }
  if (!state.files.length) files.innerHTML = '<p class="muted">No shot logs yet.</p>';
  wireDrop();
}

function sortRows() {
  const rows = state.tables[state.shooter];
  const sel = rows[state.selected];
  rows.sort((a, b) => a[0] - b[0]);
  state.selected = sel ? rows.indexOf(sel) : -1;
}

// ----------------------------------------------------------- interaction

let drag = null;
function startDrag(e, i) {
  e.preventDefault();
  e.stopPropagation();
  state.selected = i;
  drag = { i, row: state.tables[state.shooter][i] };
  svg.setPointerCapture(e.pointerId);
  render();
}
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const rect = svg.getBoundingClientRect();
  let d = dx(e.clientX - rect.left), r = dy(e.clientY - rect.top);
  if (!e.shiftKey) { d = Math.round(d * 2) / 2; r = Math.round(r / 10) * 10; }
  drag.row[0] = Math.max(view.x0, Math.min(view.x1, Math.round(d * 10) / 10));
  drag.row[2] = Math.max(0, Math.round(r));
  renderChart();
});
svg.addEventListener("pointerup", () => {
  if (!drag) return;
  drag = null;
  sortRows();
  render();
});
svg.addEventListener("dblclick", (e) => {
  const rect = svg.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  if (px < view.left || px > view.left + view.w || py < view.top || py > view.top + view.h) return;
  const row = [Math.round(dx(px) * 2) / 2, state.physics ? state.physics.hoodDeg : 60, Math.round(dy(py) / 10) * 10];
  const rows = state.tables[state.shooter];
  rows.push(row);
  state.selected = rows.length - 1;
  sortRows();
  render();
});
svg.addEventListener("pointerdown", (e) => {
  if (e.target === svg || e.target.tagName !== "rect") { state.selected = -1; renderChart(); renderSide(); }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (dirty()) save(false); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && state.selected >= 0 && document.activeElement.tagName !== "INPUT") {
    state.tables[state.shooter].splice(state.selected, 1);
    state.selected = -1;
    render();
  }
});
window.addEventListener("resize", () => renderChart());
window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });

$("save").onclick = () => save(false);
$("revert").onclick = () => loadTables();
$("pull").onclick = async () => {
  $("pull").disabled = true;
  setStatus("", "Pulling from robot…");
  const { status, data } = await api("/api/pull", {});
  $("pull").disabled = false;
  if (status === 200) {
    showBanner("warn", data.newFiles.length ? "Pulled " + data.newFiles.length + " new log file(s)." : "No new log files on the robot.",
      [["OK", hideBanner]]);
    await loadShots();
  } else {
    showBanner("bad", data.error || "Pull failed", [["OK", hideBanner]]);
  }
  render();
};

function wireDrop() {
  const drop = $("drop");
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = async (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    const msgs = [];
    for (const f of e.dataTransfer.files) {
      const { status, data } = await api("/api/upload", { name: f.name, text: await f.text() });
      msgs.push(status === 200 ? f.name + ": " + data.count + " shots" : f.name + ": " + data.error);
    }
    showBanner("warn", msgs.join("\n"), [["OK", hideBanner]]);
    await loadShots();
  };
}

loadTables().then(loadShots);
</script>
</body>
</html>
